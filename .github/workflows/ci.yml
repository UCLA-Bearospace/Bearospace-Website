name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run assets:verify
      - run: npm test
      # `prebuild` validates content and generates images, then pages are prerendered
      - run: npm run build
      - run: npm run budgets
      # Lighthouse on mobile settings: LCP, layout shift, blocking time, accessibility, SEO
      - run: npm run lhci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            playwright-report
            .lighthouseci
          retention-days: 7
